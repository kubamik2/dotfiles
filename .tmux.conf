# Enable mouse mode
set -g mouse on

# Enable 24-bit colors
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Color pallete
BG0="#282828"
BG1="#32302f"
BG2="#32302f"
BG3="#45403d"
BG4="#45403d"
BG5="#5a524c"
BG_STATUSLINE1="#32302f"
BG_STATUSLINE2="#3a3735"
BG_STATUSLINE3="#504945"
BG_CURRENT_WORD="#3c3836"
FG0="#d4be98"
FG1="#ddc7a1"

# Status bar config
set -g status-style "fg=$FG0 bg=$BG0"
set-option -g status-position bottom

set -g status-right ""
set -g status-left " [#S] #[fg=$BG5]| "

setw -g window-status-current-style "fg=$FG0 bg=$BG0"
setw -g window-status-current-format " #I:#W "

setw -g window-status-style "fg=$BG5 bg=$BG0"
setw -g window-status-format " #I:#W "
